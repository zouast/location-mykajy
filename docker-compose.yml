version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: immo-mykajy-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Zt2mLinah@2026!
      POSTGRES_DB: mykajy_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: immo-mykajy-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mykajy.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
